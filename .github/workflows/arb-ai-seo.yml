name: Top Notch Arb AI SEO Developer

on:
  schedule:
    - cron: '19 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: top-notch-seo-developer
  cancel-in-progress: false

jobs:
  improve-seo:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check optional model access
        id: setup
        env:
          AI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$AI_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'AI SEO editing skipped because OPENAI_API_KEY is not configured. Safe sitemap/metadata checks still run daily.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Avoid duplicate pending SEO repair
        id: existing
        if: steps.setup.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const prs=await github.rest.pulls.list({owner,repo,state:'open',per_page:100});
            core.setOutput('skip',prs.data.some(p=>p.head.ref==='bot/top-notch-seo-improvements')?'true':'false');

      - name: Generate factual technical SEO review and repair
        id: codex
        if: steps.setup.outputs.ready == 'true' && steps.existing.outputs.skip != 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          prompt: |
            Act as senior technical SEO manager for Top Notch Arb.
            Follow SEO_AGENT.md and AGENTS.md strictly.
            Review current HTML pages, navigation, metadata, titles, canonical
            tags and factual content quality. Improve one clear SEO or
            accessibility defect if reproducible. Use the existing audit:
            node scripts/seo-manager.cjs --audit
            Never write generic AI spam articles, fake bookmaker reviews,
            misleading guaranteed-profit promises or invented schema data.
            Do not change API odds logic, controls, risk calculations, private
            keys, github workflows, or Vercel config. Do not send odds requests.
            Restrict modifications to public HTML, corresponding CSS, or
            tests/seo-manager.test.cjs as necessary. Changes go to a PR, not
            to production. If no meaningful safe change is needed, make no edits.
            Run node scripts/seo-manager.cjs --apply and all tests.
            DO NOT commit or push; review workflow handles PR creation.

      - name: Rebuild canonical SEO files and verify all tests
        if: steps.codex.outcome == 'success'
        run: |
          node scripts/seo-manager.cjs --apply
          node scripts/seo-manager.cjs --check
          node --test tests/*.test.cjs

      - name: Create pull request for editorial review
        if: steps.codex.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: bot/top-notch-seo-improvements
          base: main
          delete-branch: true
          title: 'AI SEO Manager: tested factual website improvements'
          commit-message: 'seo: agent-proposed on-page improvement'
          body: |
            AI SEO Manager suggested a focused change.
            Review factual accuracy, responsible-gambling context,
            canonical rules, visual usability and passing tests.
            No automatic merge; SEO content improvements need approval.
            Read SEO_AGENT.md before approving.
          add-paths: |
            *.html
            *.css
            sitemap.xml
            robots.txt
            tests/seo-manager.test.cjs
