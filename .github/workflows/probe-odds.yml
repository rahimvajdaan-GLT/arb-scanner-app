name: Probe production odds

on:
  push:
    branches: [main]
    paths:
      - 'api/arbitrage.js'
      - '.github/workflows/probe-odds.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe combined Action Network book IDs
        run: |
          DATE=$(date -u +%Y%m%d)
          for MODE in comma repeated; do
            if [ "$MODE" = comma ]; then
              URL="https://api.actionnetwork.com/web/v2/scoreboard/nfl?date=$DATE&bookIds=15,30,75,123,69,68,972,71,247,79"
            else
              URL="https://api.actionnetwork.com/web/v2/scoreboard/nfl?date=$DATE&bookIds=15&bookIds=30&bookIds=75&bookIds=123&bookIds=69&bookIds=68&bookIds=972&bookIds=71&bookIds=247&bookIds=79"
            fi
            echo "=== $MODE ==="
            curl -sS -A 'Mozilla/5.0 Chrome/124 Safari/537.36' "$URL" -o "/tmp/$MODE.json"
            python - "$MODE" <<'PY'
          import json,sys
          p=f'/tmp/{sys.argv[1]}.json'
          try:
              d=json.load(open(p)); games=d.get('games',[]); keys=set()
              for g in games: keys.update(map(str,(g.get('markets') or {}).keys()))
              print({'games':len(games),'market_keys':sorted(keys),'market_key_count':len(keys)})
          except Exception as e: print({'error':str(e)})
          PY
          done
