name: Probe production odds

on:
  push:
    branches: [main]
    paths:
      - 'api/arbitrage.js'
      - '.github/workflows/probe-odds.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Allow Vercel deploy to settle
        run: sleep 5
      - name: Probe production v5 coverage
        run: |
          echo '=== SOCCER ALL LEAGUES ==='
          curl -sS --fail-with-body 'https://arb-scanner-app.vercel.app/api/arbitrage?sport_key=soccer&market_mode=all&debug=1'; echo
          echo '=== NFL ==='
          curl -sS --fail-with-body 'https://arb-scanner-app.vercel.app/api/arbitrage?sport_key=nfl&market_mode=all&debug=1'; echo
          echo '=== ALL SPORTS PROFITABLE ARBS ==='
          curl -sS --fail-with-body 'https://arb-scanner-app.vercel.app/api/arbitrage?market_mode=all'; echo
