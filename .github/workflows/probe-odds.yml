name: Probe production odds

on:
  push:
    branches: [main]
    paths:
      - 'api/arbitrage.js'
      - '.github/workflows/probe-odds.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Action Network book IDs
        run: |
          curl -sS -A 'Mozilla/5.0 Chrome/124 Safari/537.36' 'https://api.actionnetwork.com/web/v1/books' -o /tmp/books.json
          python - <<'PY'
          import json
          wanted={'15','30','75','123','69','68','972','71','247','79'}
          d=json.load(open('/tmp/books.json'))
          rows=d.get('books', d if isinstance(d,list) else [])
          out=[]
          for b in rows:
              i=str(b.get('id',''))
              if i in wanted:
                  out.append({'id':i,'name':b.get('display_name') or b.get('name'),'active':b.get('active'),'type':b.get('type')})
          print(out)
          PY
