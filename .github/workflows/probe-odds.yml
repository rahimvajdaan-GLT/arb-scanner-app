name: Probe production odds

on:
  push:
    branches: [main]
    paths:
      - 'api/arbitrage.js'
      - '.github/workflows/probe-odds.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Allow production deploy to settle
        run: sleep 3
      - name: Probe Action Network sports
        run: |
          echo '=== NFL ==='
          curl -sS --fail-with-body 'https://arb-scanner-app.vercel.app/api/arbitrage?sport_key=nfl&market_mode=all&debug=1'; echo
          echo '=== NHL ==='
          curl -sS --fail-with-body 'https://arb-scanner-app.vercel.app/api/arbitrage?sport_key=nhl&market_mode=all&debug=1'; echo
          echo '=== NBA ==='
          curl -sS --fail-with-body 'https://arb-scanner-app.vercel.app/api/arbitrage?sport_key=nba&market_mode=all&debug=1'; echo
      - name: Probe profitable output
        run: |
          echo '=== ALL MARKETS ==='
          curl -sS --fail-with-body 'https://arb-scanner-app.vercel.app/api/arbitrage?market_mode=all'; echo
          echo '=== H2H ==='
          curl -sS --fail-with-body 'https://arb-scanner-app.vercel.app/api/arbitrage?market_mode=h2h'; echo
