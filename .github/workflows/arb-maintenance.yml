name: Top Notch Arb Maintenance Agent

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: arb-maintainer
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out production repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run regression and odds-safety tests
        id: regression
        continue-on-error: true
        run: node --test tests/*.test.cjs

      - name: Check live production site without consuming bookmaker quotas
        id: production
        continue-on-error: true
        env:
          SITE_URL: https://arb-scanner-app.vercel.app
        run: node scripts/site-health.cjs

      - name: Save health check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-notch-arb-health
          path: reports/site-health.json
          if-no-files-found: warn
          retention-days: 14

      - name: Maintain one GitHub incident issue when something fails
        if: always()
        uses: actions/github-script@v7
        env:
          TEST_RESULT: ${{ steps.regression.outcome }}
          PRODUCTION_RESULT: ${{ steps.production.outcome }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const marker = '<!-- top-notch-arb-maintenance-agent -->';
            const title = '[Maintenance] Top Notch Arb automated checks failed';
            const tests = process.env.TEST_RESULT;
            const production = process.env.PRODUCTION_RESULT;
            const failing = tests !== 'success' || production !== 'success';
            const issues = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 });
            const existing = issues.find(item =>
              !item.pull_request && item.title === title && item.body?.includes(marker));
            if (failing) {
              const runUrl = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;
              const detail = [
                marker,
                '### Automatic maintainer report',
                '- Regression tests: **' + tests + '**',
                '- Live site health: **' + production + '**',
                '- Workflow run: ' + runUrl,
                '- Health report is attached as a workflow artifact.',
                '',
                '### Developer agent instructions',
                '1. Read AGENTS.md before editing.',
                '2. Reproduce the failure from CI logs; do not guess.',
                '3. Fix the smallest confirmed cause and add a regression test.',
                '4. Run node --test tests/*.test.cjs.',
                '5. Open a pull request; do not automatically deploy untested odds logic.',
                '6. Never add fake opportunities or call quota-limited /api/arbitrage from CI.',
                '',
                'The workflow closes this incident after a future passing run.'
              ].join('\n');
              if (existing) {
                const age = Date.now() - Date.parse(existing.updated_at);
                if (age > 24 * 3600000) await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: 'Still failing: tests=' + tests + ', production=' + production + '. ' + runUrl
                });
              } else await github.rest.issues.create({ owner, repo, title, body: detail });
            } else if (existing) {
              const runUrl = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: 'All scheduled checks passed: ' + runUrl + '. Closing the automated incident.'
              });
              await github.rest.issues.update({ owner, repo,
                issue_number: existing.number, state: 'closed', state_reason: 'completed' });
            }

      - name: Fail workflow when checks failed
        if: steps.regression.outcome != 'success' || steps.production.outcome != 'success'
        run: exit 1
