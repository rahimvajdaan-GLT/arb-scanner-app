name: Top Notch Arb AI General Manager

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: top-notch-general-manager
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit agent execution, delivery, and blockers
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const {owner,repo}=context.repo;
            const now=Date.now(), DAY=86400000;
            const agents=[
              {name:'Maintenance',file:'arb-maintenance.yml',maxAgeHours:8},
              {name:'SEO audit',file:'arb-seo-manager.yml',maxAgeHours:36},
              {name:'AI developer',file:'arb-ai-developer.yml',maxAgeHours:null},
              {name:'AI SEO developer',file:'arb-ai-seo.yml',maxAgeHours:192}
            ];
            const rows=[],blockers=[];
            for(const a of agents){
              try{
                const result=await github.rest.actions.listWorkflowRuns({
                  owner,repo,workflow_id:a.file,branch:'main',per_page:10
                });
                const runs=result.data.workflow_runs||[];
                const last=runs[0];
                const lastSuccessful=runs.find(r=>r.conclusion==='success');
                const age=last?(now-Date.parse(last.created_at))/3600000:null;
                const status=!last?'NO RUN':last.status!=='completed'?'IN PROGRESS':last.conclusion||'UNKNOWN';
                const url=last?.html_url||'';
                rows.push({agent:a.name,status,age:age===null?'n/a':age.toFixed(1)+'h',url});
                if(a.maxAgeHours!==null && (!last || age>a.maxAgeHours))
                  blockers.push(a.name+': scheduled run is missing or stale ('+(age===null?'none':age.toFixed(1)+'h')+').');
                if(last?.conclusion==='failure')
                  blockers.push(a.name+': latest run failed: '+url);
                if(!lastSuccessful && runs.length && a.maxAgeHours!==null)
                  blockers.push(a.name+': no successful run among latest '+runs.length+' runs.');
                if(a.name==='AI developer' && !runs.some(r=>r.conclusion==='success'))
                  rows.push({agent:'AI developer note',status:'May be skipped when no failure or model secret; not a defect by itself',age:'',url:''});
              }catch(e){
                rows.push({agent:a.name,status:'UNVERIFIED',age:'',url:''});
                blockers.push(a.name+': could not inspect workflow runs ('+e.status+').');
              }
            }
            const prs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const issues=(await github.paginate(github.rest.issues.listForRepo,{owner,repo,state:'open',per_page:100})).filter(i=>!i.pull_request);
            const oldPrs=prs.filter(p=>now-Date.parse(p.created_at)>3*DAY);
            const oldIssues=issues.filter(i=>now-Date.parse(i.updated_at)>7*DAY);
            for(const p of oldPrs)blockers.push('PR #'+p.number+' awaiting review >3 days: '+p.html_url);
            for(const i of oldIssues)blockers.push('Issue #'+i.number+' has no update >7 days: '+i.html_url);
            const recentMerged=(await github.rest.pulls.list({owner,repo,state:'closed',sort:'updated',direction:'desc',per_page:100})).data
              .filter(p=>p.merged_at && now-Date.parse(p.merged_at)<7*DAY);
            const marker='<!-- top-notch-ai-general-manager -->';
            const title='[General Manager] Agent accountability and delivery blockers';
            const report=[
              '## Top Notch Arb — AI General Manager',
              'Evidence window: latest workflow runs; merged PRs in last 7 days.',
              '| Agent | Latest run | Age | Evidence |',
              '|---|---|---|---|',
              ...rows.map(r=>'| '+r.agent+' | '+r.status+' | '+r.age+' | '+(r.url?'[run]('+r.url+')':'—')+' |'),
              '',
              '- Open PRs: '+prs.length,
              '- Open issues: '+issues.length,
              '- Merged PRs (7d): '+recentMerged.length,
              '- Overdue PRs (>3d): '+oldPrs.length,
              '- Stale issues (>7d): '+oldIssues.length,
              '',
              '### Actionable blockers',
              ...(blockers.length?blockers.map(b=>'- '+b):['- None identified by these checks. A green run is not proof of feature progress.']),
              '',
              '### Management priorities',
              '1. Repair failing production or regression checks before feature changes.',
              '2. Review outstanding PRs with verified tests; never auto-merge.',
              '3. Require evidence of meaningful product/SEO improvements, not merely green CI.',
              '4. Investigate overdue work and assign owners in GitHub issues.',
              '',
              'No bookmaker endpoints were called. No fabricated arbitrage, rankings, or delivery claims.'
            ].join('\n');
            await core.summary.addRaw(report).write();
            const open=issues.find(i=>i.title===title&&i.body?.includes(marker));
            if(blockers.length){
              const body=[marker,report,'','This issue is a supervisor escalation; agents must submit reviewed, tested PRs.'].join('\n');
              if(open){
                await github.rest.issues.update({owner,repo,issue_number:open.number,body});
              }else{
                await github.rest.issues.create({owner,repo,title,body});
              }
            }else if(open){
              await github.rest.issues.createComment({owner,repo,issue_number:open.number,body:'Automated blockers cleared in '+context.serverUrl+'/'+owner+'/'+repo+'/actions/runs/'+context.runId+'. Closing; manual backlog review still recommended.'});
              await github.rest.issues.update({owner,repo,issue_number:open.number,state:'closed'});
            }
