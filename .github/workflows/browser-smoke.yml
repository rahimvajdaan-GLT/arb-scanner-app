name: Browser smoke test (desktop and mobile)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install temporary headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test live scanner in desktop and mobile Chromium
        run: |
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('node:fs');
          (async()=>{
            fs.mkdirSync('audit-screenshots',{recursive:true});
            const browser=await chromium.launch({headless:true});
            let failed=false;
            for(const setting of [{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}]){
              const page=await browser.newPage({viewport:{width:setting.width,height:setting.height},deviceScaleFactor:1});
              const errors=[];page.on('pageerror',err=>errors.push(err.message));
              const response=await page.goto('https://arb-scanner-app.vercel.app/scanner.html',{waitUntil:'domcontentloaded',timeout:60000});
              await page.locator('#scanLiveBtn').waitFor({timeout:20000});
              const title=await page.title();
              await page.waitForFunction(()=>{
               const el=document.querySelector('#comparisonCount');
               return el&&el.textContent!=='Waiting for scan'
              },{timeout:80000}).catch(e=>{errors.push('Comparison did not complete in time: '+e.message)});
              const result=await page.evaluate(()=>({
                title:document.title,
                board:document.querySelector('#comparisonCount')?.textContent,
                comparisonCards:document.querySelectorAll('.comparison-card').length,
                sports:document.querySelector('#liveSport')?.options.length,
                metric:document.querySelector('#metricCount')?.textContent,
                diagnostic:document.querySelector('#feedDiagnostics')?.innerText.slice(0,500),
                maxWidth:document.documentElement.scrollWidth,
                viewportWidth:window.innerWidth,
                pageError:document.querySelector('.error-panel')?.textContent||null
              }));
              await page.screenshot({path:'audit-screenshots/'+setting.name+'.png',fullPage:true});
              console.log(setting.name,JSON.stringify({http:response.status(),...result,errors}));
              const parsed=Number(result.diagnostic?.match(/Games parsed: (\\d+)/)?.[1]||0);
              if(response.status()!==200||errors.length||result.maxWidth>result.viewportWidth+16||result.sports<7)failed=true;
              if(parsed>0&&result.comparisonCards===0){console.error('Odds arrived but comparison and fixture board stayed empty');failed=true}
              await page.close();
            }
            await browser.close();
            if(failed)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Save audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-notch-arb-browser-audit
          path: audit-screenshots
          if-no-files-found: ignore
