name: Inspect Entain market schema
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/entain-inspection.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch one soccer event card and inspect market-price identifiers
        run: |
          node <<'JS'
          const base='https://api.neds.com.au';
          const headers={'Origin':'https://www.neds.com.au','Referer':'https://www.neds.com.au/','Accept':'application/json'};
          async function get(url){const response=await fetch(url,{headers,signal:AbortSignal.timeout(12000)});if(!response.ok)throw Error(response.status+' '+url);return response.json()}
          (async()=>{
            const qs=new URLSearchParams({category_ids:JSON.stringify(['71955b54-62f6-4ac5-abaa-df88cad0aeef'])});
            const feed=await get(base+'/v2/sport/event-request?'+qs);
            const rows=Object.values(feed.events||feed.data?.events||{});
            console.log('Events in soccer category',rows.length);
            const next=rows.find(e=>e.id&&(!e.match_status||e.match_status==='BettingOpen'));
            if(!next)throw Error('No event found');
            const card=await get(base+'/v2/sport/event-card?id='+encodeURIComponent(next.id));
            const markets=Object.entries(card.markets||{});
            const candidates=markets.filter(([k,m])=>/^(match betting|head to head|match result|moneyline)$/i.test(String(m.name||m.display_name||'')));
            console.log('First event',next.name,'Markets',markets.length,'Relevant markets',candidates.length);
            for(const [key,m] of candidates.slice(0,3)){
              console.log('MATCH MARKET',JSON.stringify({key,id:m.id,name:m.name,entrant_ids:m.entrant_ids,fields:Object.keys(m)}).slice(0,2000));
              const entrants=Object.entries(card.entrants||{}).filter(([eid,e])=>e.market_id===key||e.market_id===m.id||m.entrant_ids?.includes(eid));
              console.log('MARKET ENTRANTS',JSON.stringify(entrants.slice(0,5)).slice(0,3000));
            }
            const examples=Object.entries(card.prices||{}).slice(0,8).map(([key,p])=>({key,price:p}));
            console.log('SAMPLE PRICE RECORDS',JSON.stringify(examples).slice(0,5000));
            console.log('PRICES',Object.keys(card.prices||{}).length);
          })().catch(e=>{console.error(String(e));process.exitCode=1});
          JS
