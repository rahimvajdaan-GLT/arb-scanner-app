name: Arbitrage scanner regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-and-matching:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch repository
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test odds, matching, and frontend safety
        run: node --test tests/arb-engine.test.cjs
