<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Top Notch Arb</title><meta name="description" content="Log in to your Top Notch Arb account."><meta name="robots" content="noindex,follow"><link rel="stylesheet" href="/site.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head><body><header class="site-header"><nav class="site-nav"><a class="site-brand" href="/"><span class="site-logo">TNA</span><span>Top Notch Arb</span></a><div class="nav-actions"><a class="btn btn-secondary" href="/scanner.html">Scanner</a></div></nav></header><main><section class="form-card"><h1>Welcome back</h1><p>Log in to your Top Notch Arb account.</p><div id="msg"></div><form id="loginForm"><div class="form-row"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="form-row"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" style="width:100%" type="submit">Log in</button></form><p class="auth-note">Secure session cookies are used. Account credentials are configured privately on the server.</p></section></main><script>const f=document.getElementById('loginForm'),m=document.getElementById('msg');f.addEventListener('submit',async e=>{e.preventDefault();m.className='notice';m.textContent='Signing in…';const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json().catch(()=>({}));if(r.ok){m.className='notice success';m.textContent='Login successful. Redirecting…';location.href='/account.html'}else{m.className='notice error';m.textContent=d.error||'Login failed';}});</script></body></html>
